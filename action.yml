name: evalproof gate
description: >-
  Compare a candidate evaluation run against a baseline on paired cases, write the report
  to the job summary, and fail the job only on a regression that is both large enough to
  matter and statistically significant.
branding:
  icon: check-circle
  color: green

inputs:
  baseline:
    description: Path to the baseline run JSON (e.g. produced on the main branch).
    required: true
  candidate:
    description: Path to the candidate run JSON (produced on this branch).
    required: true
  suite:
    description: Suite YAML whose `gate` block sets the metric and thresholds.
    required: false
    default: ""
  verify-candidate:
    description: >-
      With a suite, first run `evalproof verify` on the candidate: it must have been made
      with that suite's system, judge, scorers and seed, and cover exactly the dataset's
      cases as they are now. A mismatch fails the job (exit 4) and skips the comparison.
      Set to "false" to skip the check.
    required: false
    default: "true"
  metric:
    description: >-
      Scorer to gate on, if not taken from the suite. Several, separated by newlines or
      commas, are all gated with a Holm correction for the number of metrics.
    required: false
    default: ""
  max-drop:
    description: Largest tolerated drop, as a fraction (0.02 = two points).
    required: false
    default: ""
  alpha:
    description: Significance level.
    required: false
    default: ""

outputs:
  exit-code:
    description: "0 pass, 1 regression, 3 budget breach, 4 cannot gate, 2 usage error."
    value: ${{ steps.gate.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
    - id: gate
      shell: bash
      env:
        EP_BASELINE: ${{ inputs.baseline }}
        EP_CANDIDATE: ${{ inputs.candidate }}
        EP_SUITE: ${{ inputs.suite }}
        EP_VERIFY: ${{ inputs.verify-candidate }}
        EP_METRIC: ${{ inputs.metric }}
        EP_MAX_DROP: ${{ inputs.max-drop }}
        EP_ALPHA: ${{ inputs.alpha }}
        EP_SOURCE: ${{ github.action_path }}
      run: |
        # Verify first: a candidate that does not match the suite cannot be gated.
        if [ -n "$EP_SUITE" ] && [ "$EP_VERIFY" = "true" ]; then
          set +e
          uvx --from "$EP_SOURCE" evalproof verify "$EP_CANDIDATE" "$EP_SUITE" \
            --markdown "$GITHUB_STEP_SUMMARY"
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "exit-code=$code" >> "$GITHUB_OUTPUT"
            exit "$code"
          fi
        fi
        args=(compare "$EP_BASELINE" "$EP_CANDIDATE" --gate --markdown "$GITHUB_STEP_SUMMARY")
        [ -n "$EP_SUITE" ] && args+=(--suite "$EP_SUITE")
        # One --metric per name: split on commas and newlines, trim, skip blanks.
        while IFS= read -r metric; do
          metric="${metric#"${metric%%[![:space:]]*}"}"
          metric="${metric%"${metric##*[![:space:]]}"}"
          if [ -n "$metric" ]; then args+=(--metric "$metric"); fi
        done <<< "$(printf '%s' "$EP_METRIC" | tr ',' '\n')"
        [ -n "$EP_MAX_DROP" ] && args+=(--max-drop "$EP_MAX_DROP")
        [ -n "$EP_ALPHA" ] && args+=(--alpha "$EP_ALPHA")
        set +e
        uvx --from "$EP_SOURCE" evalproof "${args[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit $code
