name: evalproof gate
description: >-
  Compare a candidate evaluation run against a baseline on paired cases, write the report
  to the job summary, and fail the job only on a regression that is both large enough to
  matter and statistically significant.
branding:
  icon: check-circle
  color: green

inputs:
  baseline:
    description: Path to the baseline run JSON (e.g. produced on the main branch).
    required: true
  candidate:
    description: Path to the candidate run JSON (produced on this branch).
    required: true
  suite:
    description: Suite YAML whose `gate` block sets the metric and thresholds.
    required: false
    default: ""
  verify-candidate:
    description: >-
      With a suite, first run `evalproof verify` on the candidate: it must have been made
      with that suite's system, judge, scorers and seed, and cover exactly the dataset's
      cases as they are now. A mismatch fails the job (exit 4) and skips the comparison.
      Set to "false" to skip the check.
    required: false
    default: "true"
  metric:
    description: >-
      Scorer to gate on, if not taken from the suite. Several, separated by newlines or
      commas, are all gated with a Holm correction for the number of metrics.
    required: false
    default: ""
  max-drop:
    description: Largest tolerated drop, as a fraction (0.02 = two points).
    required: false
    default: ""
  alpha:
    description: Significance level.
    required: false
    default: ""
  pr-comment:
    description: >-
      Set to "true" to post the report as one comment on the pull request, and to update that
      comment on later runs. The token needs `pull-requests: write`. The comment never changes
      the result: when it cannot be posted (a pull request from a fork gets a read-only token)
      the action prints a warning and keeps the gate's result.
    required: false
    default: "false"
  github-token:
    description: Token that posts the comment when `pr-comment` is "true".
    required: false
    default: ${{ github.token }}

outputs:
  exit-code:
    description: "0 pass, 1 regression, 3 budget breach, 4 cannot gate, 2 usage error."
    value: ${{ steps.gate.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - id: gate
      shell: bash
      env:
        EP_BASELINE: ${{ inputs.baseline }}
        EP_CANDIDATE: ${{ inputs.candidate }}
        EP_SUITE: ${{ inputs.suite }}
        EP_VERIFY: ${{ inputs.verify-candidate }}
        EP_METRIC: ${{ inputs.metric }}
        EP_MAX_DROP: ${{ inputs.max-drop }}
        EP_ALPHA: ${{ inputs.alpha }}
        EP_SOURCE: ${{ github.action_path }}
      run: |
        # Keep a copy of the report for the comment step: every step has its own
        # $GITHUB_STEP_SUMMARY file, so the next step cannot read this one.
        report="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/evalproof-report.md"
        : > "$report"
        trap 'cp "$GITHUB_STEP_SUMMARY" "$report" 2>/dev/null || true' EXIT
        # Verify first: a candidate that does not match the suite cannot be gated.
        if [ -n "$EP_SUITE" ] && [ "$EP_VERIFY" = "true" ]; then
          set +e
          uvx --from "$EP_SOURCE" evalproof verify "$EP_CANDIDATE" "$EP_SUITE" \
            --markdown "$GITHUB_STEP_SUMMARY"
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "exit-code=$code" >> "$GITHUB_OUTPUT"
            exit "$code"
          fi
        fi
        args=(compare "$EP_BASELINE" "$EP_CANDIDATE" --gate --markdown "$GITHUB_STEP_SUMMARY")
        [ -n "$EP_SUITE" ] && args+=(--suite "$EP_SUITE")
        # One --metric per name: split on commas and newlines, trim, skip blanks.
        while IFS= read -r metric; do
          metric="${metric#"${metric%%[![:space:]]*}"}"
          metric="${metric%"${metric##*[![:space:]]}"}"
          if [ -n "$metric" ]; then args+=(--metric "$metric"); fi
        done <<< "$(printf '%s' "$EP_METRIC" | tr ',' '\n')"
        [ -n "$EP_MAX_DROP" ] && args+=(--max-drop "$EP_MAX_DROP")
        [ -n "$EP_ALPHA" ] && args+=(--alpha "$EP_ALPHA")
        set +e
        uvx --from "$EP_SOURCE" evalproof "${args[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit $code
    # Runs after a failed gate too, so a regression is reported where the author reads it.
    # It never fails: the gate step's result is the action's result.
    - id: comment
      if: always() && inputs.pr-comment == 'true' && github.event.pull_request.number
      shell: bash
      env:
        EP_COMMENT: ${{ inputs.pr-comment }}
        EP_PR: ${{ github.event.pull_request.number }}
        EP_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        [ "$EP_COMMENT" = "true" ] && [ -n "$EP_PR" ] || exit 0
        marker='<!-- evalproof-report -->'
        limit=65000 # a comment holds 65536 characters; leave room for the marker and the note
        dir="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
        report="$dir/evalproof-report.md"
        body="$dir/evalproof-comment.md"

        post() {
          # gh reads the body from a file (-F body=@file), so a long report never hits the
          # command-line length limit, and no JSON is built here.
          size=$(wc -c < "$report" | tr -d ' ') || return 1
          {
            printf '%s\n\n' "$marker"
            if [ "$size" -gt "$limit" ]; then
              head -c "$limit" "$report"
              printf '\n\n_The report was cut here to fit in a comment. The job summary has all of it._\n'
            else
              cat "$report"
            fi
          } > "$body" || return 1
          # The first comment that carries the marker is ours; later runs update it.
          filter='.[] | select((.body // "") | contains("'"$marker"'")) | .id'
          ids=$(gh api "repos/$EP_REPO/issues/$EP_PR/comments" --paginate --jq "$filter") || return 1
          id=$(printf '%s\n' "$ids" | tr -d '\r' | sed -n '1p')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$EP_REPO/issues/comments/$id" -F "body=@$body" > /dev/null || return 1
            echo "evalproof: updated the pull request comment $id"
          else
            gh api "repos/$EP_REPO/issues/$EP_PR/comments" -F "body=@$body" > /dev/null || return 1
            echo "evalproof: posted a pull request comment"
          fi
        }

        if [ ! -s "$report" ]; then
          echo "evalproof: no report was written, so there is no pull request comment to post"
        elif ! post; then
          echo "::warning::evalproof could not post the pull request comment. The workflow needs pull-requests: write, and a pull request from a fork gets a read-only token. The gate's result is unchanged."
        fi
        exit 0
