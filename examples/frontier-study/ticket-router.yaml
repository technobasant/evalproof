# Study (2026-11): the 60 ticket-routing cases of ../deterministic, answered by a model instead
# of keyword rules. One exact label per case and no judge, so a repeated run measures pure
# sampling noise. One variant per model; each writes runs/<variant>.json. See README.md.
name: ticket-router-frontier
dataset: ticket-router.sample.jsonl  # every second case of ../deterministic/cases.jsonl (30 of 60)
seed: 0

system:
  target: claude-code:claude-sonnet-5-5
  label: "Anthropic Claude Sonnet 5.5"
  system_prompt_file: prompt.router.md
  prompt_template: "{input}"
  timeout_s: 300

variants:
  - name: anthropic
  - name: openai
    system:
      target: codex:gpt-6-astra
      label: "OpenAI GPT-6 Astra (medium effort)"
      params: {extra: {reasoning_effort: medium}}
  - name: google
    system:
      target: cursor:gemini-4-argon-medium
      label: "Google Gemini 4 Argon Medium"

scorers:
  - name: queue
    type: exact_match

gate:
  metric: queue
  max_drop: 0.02
  alpha: 0.05
  min_cases: 30

cache_dir: .evalproof/cache
