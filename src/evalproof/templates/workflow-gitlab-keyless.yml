# Written by `evalproof init --platform gitlab --ci keyless`.
#
# `evalproof init` never edits .gitlab-ci.yml. Add these two lines to it, or create it:
#
#   include:
#     - local: .gitlab-ci.evalproof.yml
#
# The evals run on a developer's machine, on their own login, and the merge request commits the
# result (evals/runs/latest.json). This job makes no model calls and needs no variable: it
# compares that file with the one on the target branch and fails the merge request pipeline on a
# regression that is both large enough to matter and statistically significant.
#
# What that proves, and what it does not. Before comparing, the job runs `evalproof verify`:
# the committed run must match the committed suite (system, judge, scorers, seed) and cover
# exactly the dataset's cases as they are now. So a stale run file, a --limit run and an
# edited case all fail the job. It also scores the stored outputs again with the suite's scorers
# that need no model, so a deterministic score edited by hand fails the job too. It cannot check
# model-judged scores or the stored outputs themselves. For merge requests from people you do not
# trust (forks), review the run file, or use `evalproof init --platform gitlab --ci api-key`,
# which makes the run in CI.
#
# The job runs in merge request pipelines only, because the baseline is the target branch. If
# your other jobs also run on every branch push, add a `workflow: rules:` block so a push to a
# branch with an open merge request does not start two pipelines.
evalproof:
  stage: test # change this if your pipeline has no `test` stage
  image: python:3.13-slim # an image with git skips the git install below
  timeout: 10 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0" # the target branch has to be in the clone
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_ROOT_USER_ACTION: ignore
    # `evalproof verify` (in the script below) already catches a changed suite or dataset. This
    # list is for files it cannot see: application code that holds your prompts or retrieval
    # logic. Space-separated paths whose change should come with a fresh run file; add yours.
    EVALPROOF_WATCH: evals/
  script:
    - |
      set -eu
      command -v git > /dev/null || { apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null; }
      target="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      git fetch --quiet origin "+refs/heads/$target:refs/remotes/origin/$target"

      # Take the baseline from the target branch.
      baseline="${TMPDIR:-/tmp}/evalproof-baseline.json"
      if ! git cat-file -e "origin/$target:evals/runs/latest.json" 2>/dev/null; then
        echo "evalproof: notice: $target has no evals/runs/latest.json yet, so there is nothing to compare with. Merge it and later merge requests are gated."
        exit 0
      fi
      if [ ! -f evals/runs/latest.json ]; then
        echo "evalproof: error: evals/runs/latest.json is missing from this branch. Run the suite and commit the file." >&2
        exit 1
      fi
      git show "origin/$target:evals/runs/latest.json" > "$baseline"

      # Warn when the run file is stale.
      set -f
      changed="$(git diff --name-only "origin/$target...HEAD" -- $EVALPROOF_WATCH ':(exclude)evals/runs/')"
      set +f
      refreshed="$(git diff --name-only "origin/$target...HEAD" -- evals/runs/latest.json)"
      if [ -n "$changed" ] && [ -z "$refreshed" ]; then
        echo "evalproof: warning: these files changed but evals/runs/latest.json did not, so the gate compares results that predate the change: $(printf '%s' "$changed" | tr '\n' ' ')"
      fi

      # Verify first: a run file that does not match the suite cannot be gated.
      python -m pip install --quiet "evalproof==@@PIP_VERSION@@"
      evalproof verify evals/runs/latest.json evals/suite.yaml
      evalproof compare "$baseline" evals/runs/latest.json --suite evals/suite.yaml --gate --junit evalproof-junit.xml
  artifacts:
    when: always # the report of a failed gate is the one you want to read
    expire_in: 1 week
    reports:
      junit: evalproof-junit.xml
