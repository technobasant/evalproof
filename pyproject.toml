[build-system]
requires = ["hatchling>=1.33.0", "hatch-fancy-pypi-readme>=25.1.0"]
build-backend = "hatchling.build"

[project]
name = "evalproof"
dynamic = ["version", "readme"]
description = "Treat LLM and agent evaluation as measurement: calibrate the judge, test agents, gate CI only on significant regressions."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Basant Bhattarai" }]
requires-python = ">=3.11"
keywords = ["llm", "evaluation", "llm-as-a-judge", "calibration", "ci", "statistics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
]

[project.urls]
Homepage = "https://github.com/technobasant/evalproof"
Documentation = "https://basantbhattarai.com.np/evalproof/"
Source = "https://github.com/technobasant/evalproof"
Issues = "https://github.com/technobasant/evalproof/issues"
Changelog = "https://github.com/technobasant/evalproof/blob/main/CHANGELOG.md"
"Live demo" = "https://evalproof.streamlit.app"
"Write-up" = "https://basantbhattarai.com.np/writing/eval-score-drop-twelve-answers/"

[project.scripts]
evalproof = "evalproof.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=5.0",
    "ruff>=0.17.6",
    "types-PyYAML>=6.0",
]
docs = [
    "mkdocs-material>=9.8.2,<10",
    "mkdocs-git-revision-date-localized-plugin>=1.4",
    "mkdocstrings[python]>=1.0.8",
]

[tool.hatch.version]
path = "src/evalproof/_version.py"

# PyPI renders the README but cannot follow relative links, so the copy published there
# points them at GitHub. The README in the repository stays as written. The full documentation
# is the MkDocs site in docs/, which is not part of the wheel or the sdist.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# The PyPI page shows its own version and supported Pythons, and a badge rendered there
# from a just-uploaded release can be cached as "not found" for a day.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\[!\[(PyPI|Python)\]\(https://img\.shields\.io/pypi/[^)]+\)\]\([^)]+\)\n'
replacement = ''

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/technobasant/evalproof/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/evalproof"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/evalproof",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/CHANGELOG.md",
    "/CITATION.cff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["evalproof"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.uv]
# Supply-chain guard: never resolve a release younger than three days. It lives
# here, not only in a personal uv.toml, so the lockfile means the same thing on
# every machine and in CI.
exclude-newer = "3 days"
