name: release

# Publishing a GitHub release builds the distributions once, checks them, publishes them
# to PyPI with trusted publishing (no stored token; PyPI attaches PEP 740 attestations),
# and attaches the same files to the release with a build-provenance attestation.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.23"

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false # a release builds from nothing restored
      - name: The tag must name the package version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/evalproof/_version.py)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match package version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: The wheel installs and reports the tagged version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check dist/*.whl
          test "$(/tmp/wheel-check/bin/evalproof --version)" = "evalproof $VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/evalproof/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # trusted publishing and PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Attach to the GitHub release
    needs: [build, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload the files to the release
      id-token: write # sign the provenance
      attestations: write # store the attestation with the repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attach the distributions to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"

  # The npm launcher (npm/): `npx evalproof` runs the PyPI release of the same version, so it is
  # published only after PyPI has the files. It stays off until it is set up, so a release
  # never fails for want of it. To turn it on:
  #   1. On npmjs.com, publish the package once by hand if it does not exist, then open
  #      the package settings and add a trusted publisher: package evalproof, repository
  #      technobasant/evalproof, workflow release.yml (no environment).
  #   2. Set the repository variable NPM_PUBLISH to true.
  # Trusted publishing needs no token: npm exchanges the job's OIDC identity for a short-lived
  # credential, and attaches a provenance statement.
  npm:
    name: Publish the npm launcher
    needs: pypi
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: The tag must name the npm package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./npm/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match npm/package.json version $version"; exit 1
          fi
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest # trusted publishing needs npm 11.5.1 or newer
      - name: Publish
        working-directory: npm
        run: npm publish --provenance --access public
