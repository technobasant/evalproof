name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs, with the release in a comment; Dependabot
# keeps both current. uv is pinned to the version that wrote uv.lock; bump both together.
env:
  UV_VERSION: "0.12.23"

jobs:
  lint:
    name: Lint, types and workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - name: Audit the workflows (zizmor)
        run: uvx zizmor@1.30.1 --offline --persona=regular .github/workflows action.yml

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=85

  # Builds exactly what the release workflow publishes and checks it the way PyPI and a
  # user would: strict metadata check, no relative links left in the PyPI README, and a
  # clean install whose CLI and public API work.
  package:
    name: Package as published
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: The PyPI README has no relative links, Mermaid or PyPI-data badges
        run: |
          unzip -p dist/*.whl '*.dist-info/METADATA' > /tmp/METADATA
          if grep -nE '\]\((\./)?[A-Za-z][^:)]*\)|```mermaid|img\.shields\.io/pypi/' /tmp/METADATA; then
            echo "::error::the PyPI long description has a relative link, Mermaid or a PyPI-data badge"; exit 1
          fi
      - name: The wheel installs and works
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check dist/*.whl
          /tmp/wheel-check/bin/evalproof --version
          /tmp/wheel-check/bin/python -c "import evalproof; assert all(hasattr(evalproof, n) for n in evalproof.__all__)"

  # The gate has to fail when it should and pass when it should. No model needed:
  # the offline example is a keyword router with known regressions.
  gate-contract:
    name: Gate exit codes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - name: run the four routers
        run: |
          for v in baseline regressed noisy refactored; do
            uv run evalproof run examples/deterministic/suite.yaml \
              --system "python:router:${v}_route" --out "/tmp/$v.json" --quiet > /dev/null
          done
      - name: assert exit codes
        run: |
          set +e
          check() {
            uv run evalproof compare /tmp/baseline.json "/tmp/$1.json" \
              --suite examples/deterministic/suite.yaml --gate --markdown "$GITHUB_STEP_SUMMARY" > /dev/null
            got=$?
            if [ "$got" != "$2" ]; then echo "::error::$1: expected exit $2, got $got"; exit 1; fi
            echo "$1 → exit $got (expected $2)"
          }
          check regressed 1
          check noisy 0
          check refactored 0
      - name: the retrieval example gates on nDCG@5
        run: |
          set +e
          for v in good noisy; do
            uv run evalproof run examples/retrieval/suite.yaml \
              --system "python:retrievers:${v}_retriever" --out "/tmp/retrieval-$v.json" --quiet > /dev/null
          done
          check() {
            uv run evalproof compare /tmp/retrieval-good.json "/tmp/retrieval-$1.json" \
              --suite examples/retrieval/suite.yaml --gate > /dev/null
            got=$?
            if [ "$got" != "$2" ]; then echo "::error::retrieval $1: expected exit $2, got $got"; exit 1; fi
            echo "retrieval $1 → exit $got (expected $2)"
          }
          check noisy 1
          check good 0

  # The Streamlit app imports src/ directly, so a library change can break it without
  # failing the tests above. Install the app's own requirements, as Streamlit Community
  # Cloud does, and drive both views.
  app:
    name: Streamlit app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: install what Streamlit Community Cloud installs
        run: |
          uv venv /tmp/app
          uv pip install --python /tmp/app -r app/requirements.txt pytest
      - run: /tmp/app/bin/python -m pytest app -p no:cacheprovider
